packages:
  - packages/**
  - playground/**

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  rolldown: true
  sharp: true
  unrs-resolver: true

overrides:
  cookie@<0.7.0: 0.7.2
  postcss@<8.5.10: '>=8.5.10'

minimumReleaseAgeExclude:
  - tiny-open@1.3.0 # Remove after 2026-06-11
